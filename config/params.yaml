# Parameters for the CPU-based obstacle detection node
# Launch with: ros2 launch obstacle_detection obstacle_detection.launch.py

obstacle_detection_node:
  ros__parameters:
    # ── Topics ────────────────────────────────────────────────────────────────
    input_topic:   "/ouster/points/filtered"   # input PointCloud2 topic
    cluster_topic: "/detected_obstacles"    # coloured cluster cloud output
    marker_topic:  "/obstacle_markers"      # bounding-box MarkerArray output

    # ── Frame ─────────────────────────────────────────────────────────────────
    target_frame: "base_link"

    # ── Euclidean cluster parameters ─────────────────────────────────────────
    # Maximum spatial distance (m) between points in the same cluster
    cluster_tolerance: 0.5

    # Cluster size bounds (points)
    min_cluster_size: 8
    max_cluster_size: 10000

    # Adaptive near/mid/far clustering reduces the point-count bias against
    # distant objects while keeping the near field more selective.
    use_adaptive_clustering: true
    near_range_max: 15.0
    mid_range_max: 30.0
    near_cluster_tolerance: 0.45
    mid_cluster_tolerance: 0.70
    far_cluster_tolerance: 1.00
    near_min_cluster_size: 50
    mid_min_cluster_size: 13
    far_min_cluster_size: 8

    # ── Voxel downsampling (CPU pre-filter) ──────────────────────────────────
    use_downsampling: true
    # Voxel leaf size (m) – smaller = more precise but slower
    voxel_leaf_size: 0.1

    # Persistent tracking keeps marker IDs and colors stable between frames.
    enable_tracking: true
    tracking_max_association_distance: 1.5
    tracking_range_gate_scale: 0.03
    tracking_max_missed_frames: 5
    tracking_smoothing_alpha: 0.6

    # Use timestamped TF lookups to reduce motion-induced jitter.
    tf_lookup_timeout_sec: 0.05
