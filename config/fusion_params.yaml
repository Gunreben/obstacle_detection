detection_fusion_node:
  ros__parameters:
    marker_topic: "/obstacle_markers"
    pointcloud_topic: "/ouster/points"
    output_topic: "/safety_zone/detections"
    alert_topic: "/safety_zone/alerts"
    target_frame: "base_link"

    # --- Camera configuration -------------------------------------------------
    # Each entry needs a matching block under "cameras.<name>".
    camera_names:
      - "zed_front"
      - "side_left"
      - "rear_left"
      - "rear_mid"
      - "rear_right"
      - "side_right"

    cameras:
      zed_front:
        yolo_topic: "/zed/zed_node/left_raw/image_raw_color/compressed_bboxes"
        camera_frame: "zed_left_camera_optical_frame"
        camera_info_topic: "/zed/left/camera_info"
      side_left:
        yolo_topic: "/camera/side_left/image_raw/compressed_bboxes"
        camera_frame: "camera_side_left"
        camera_info_topic: "/camera/side_left/image_raw/camera_info"
      rear_left:
        yolo_topic: "/camera/rear_left/image_raw/compressed_bboxes"
        camera_frame: "camera_rear_left"
        camera_info_topic: "/camera/rear_left/image_raw/camera_info"
      rear_mid:
        yolo_topic: "/camera/rear_mid/image_raw/compressed_bboxes"
        camera_frame: "camera_rear_mid"
        camera_info_topic: "/camera/rear_mid/image_raw/camera_info"
      rear_right:
        yolo_topic: "/camera/rear_right/image_raw/compressed_bboxes"
        camera_frame: "camera_rear_right"
        camera_info_topic: "/camera/rear_right/image_raw/camera_info"
      side_right:
        yolo_topic: "/camera/side_right/image_raw/compressed_bboxes"
        camera_frame: "camera_side_right"
        camera_info_topic: "/camera/side_right/image_raw/camera_info"

    # Extra pixel padding around YOLO bbox for LiDAR point lookup.
    # Increase if calibration is imperfect.
    bbox_margin_pixels: 15

    # Max distance (m) to associate a camera detection with a LiDAR cluster.
    max_association_distance: 2.0

    # Minimum LiDAR points inside a bbox to consider it a valid 3D detection.
    min_lidar_points_in_bbox: 3

    # When no LiDAR points project into a bbox, place camera-only detections by
    # intersecting the bbox bottom-center ray with the ground plane.
    enable_ground_projection_fallback: true
    ground_z: 0.0

    # Safety zones in base_link frame (x = lateral, y = forward)
    red_zone_x_min: -4.0
    red_zone_x_max: 4.0
    red_zone_y_min: -6.0
    red_zone_y_max: 12.0

    yellow_zone_x_min: -8.0
    yellow_zone_x_max: 8.0
    yellow_zone_y_min: -7.0
    yellow_zone_y_max: 20.0
